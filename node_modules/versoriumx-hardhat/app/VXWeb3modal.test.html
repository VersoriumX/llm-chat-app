<!DOCTYPE html>
<html>
<head>
    <title>VXWeb3modal Test</title>
</head>
<body>
    <iframe id="targetFrame" src="VXWeb3modal.html" width="800" height="600"></iframe>
    <script>
        window.onload = function() {
            var iframe = document.getElementById('targetFrame');
            iframe.onload = function() {
                console.log("iFrame loaded successfully.");
                var iframeWindow = iframe.contentWindow;
                if (iframeWindow && iframeWindow.fetchPrices) {
                    iframeWindow.fetchPrices().then(data => {
                        console.log("fetchPrices executed successfully:", data);
                    }).catch(error => {
                        console.error("Error in fetchPrices:", error);
                    });
                } else {
                    console.error("fetchPrices function not found in iframe.");
                }
            };
        };
    </script>
</body>
</html>
