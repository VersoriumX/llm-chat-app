<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VersoriumX Technology Inc - Price Watcher</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/web3/dist/web3.min.js"></script>
    <script src="https://unpkg.com/web3modal"></script>
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            width: 600px;
            border: 1px solid #444;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
        }
        h2 {
            text-align: center;
        }
        canvas {
            max-width: 100%;
            height: 300px;
        }
        #walletButton {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
        }
        #walletButton:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h2>VersoriumX Technology Inc</h2>
    <h3>Price Watcher</h3>
    <canvas id="metalChart"></canvas>
    <canvas id="cryptoChart"></canvas>
    <button id="walletButton">Connect Wallet</button>
    <div id="walletAddress" style="text-align: center; margin-top: 10px;"></div>

    <script>
        const metals = {
            gold: { color: 'gold', symbol: 'XAU' },
            platinum: { color: 'plum', symbol: 'XPT' },
            silver: { color: 'silver', symbol: 'XAG' },
            nickel: { color: 'lightblue', symbol: 'NICKEL' },
            copper: { color: 'brown', symbol: 'COPPER' }
        };

        const cryptos = {
            bitcoin: { color: 'orange', symbol: 'BTC' },
            ethereum: { color: 'blue', symbol: 'ETH' },
            ethereumX: { color: 'green', symbol: 'ETHX' }
        };

        const ctxMetals = document.getElementById('metalChart').getContext('2d');
        const ctxCryptos = document.getElementById('cryptoChart').getContext('2d');

        const metalDatasets = Object.keys(metals).map(metal => ({
            label: metal.charAt(0).toUpperCase() + metal.slice(1),
            borderColor: metals[metal].color,
            backgroundColor: metals[metal].color,
            data: [],
            fill: false,
            tension: 0.1
        }));

        const cryptoDatasets = Object.keys(cryptos).map(crypto => ({
            label: crypto.charAt(0).toUpperCase() + crypto.slice(1),
            borderColor: cryptos[crypto].color,
            backgroundColor: cryptos[crypto].color,
            data: [],
            fill: false,
            tension: 0.1
        }));

        const metalChart = new Chart(ctxMetals, {
            type: 'line',
            data: {
                labels: [],
                datasets: metalDatasets
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom'
                    },
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });

        const cryptoChart = new Chart(ctxCryptos, {
            type: 'line',
            data: {
                labels: [],
                datasets: cryptoDatasets
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom'
                    },
                    y: {
                        beginAtZero: false
                    }
                }
            }
        });

        async function fetchPrices() {
            const metalsApiKey = 'YOUR_METALS_API_KEY'; // Replace with your Metals-API key
            const cryptoApiKey = 'YOUR_CRYPTO_API_KEY'; // Replace with your CoinMarketCap API key

            const metalsUrl = `https://metals-api.com/api/latest?access_key=${metalsApiKey}&currencies=XAU,XPT,XAG,NICKEL,COPPER`;
            const cryptoUrl = `https://pro-api.coinmarketcap.com/v1/cryptocurrency/quotes/latest?symbol=BTC,ETH&CMC_PRO_API_KEY=${cryptoApiKey}`;

            const metalsResponse = await fetch(metalsUrl);
            const metalsData = await metalsResponse.json();
            const cryptoResponse = await fetch https://etxco.com/);
            const cryptoData = await cryptoResponse.json();

            return {
                metals: metalsData.rates,
                cryptos: {
                    bitcoin: cryptoData.data.BTC.quote.USD.price,
                    ethereum: cryptoData.data.ETH.quote.USD.price,
                    ethereumX: metalsData.rates.XAU // https://www.coingecko.com/en/coins/ethereumx
                }
            };
        }
